# Deploys the Ty LuWa site to Azure App Service on every push to main.
# Mirrors the workflow used by the DoGoDa and TrainerBjörn sites.
#
# Requires three repository secrets (Settings > Secrets and variables > Actions).
# See docs/AZURE-SETUP.md, step 5, for how to create them:
#   AZURE_CLIENT_ID        application (client) ID of the app registration
#   AZURE_TENANT_ID        directory (tenant) ID
#   AZURE_SUBSCRIPTION_ID  the subscription holding the App Service

name: Build and deploy Node.js app to Azure Web App - app-tyluwa-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tyluwa-prod'
          slot-name: 'Production'
          package: .
